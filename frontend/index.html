<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG AI - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg">
        <div class="text-center mb-8">
            <h2 id="formTitle" class="text-3xl font-bold text-gray-800">Welcome Back</h2>
            <p id="formSubtitle" class="text-gray-500 mt-2">Sign in to access RAG AI Chat</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username / Email</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="user" class="h-5 w-5 text-gray-400"></i>
                    </div>
                    <input type="text" id="username" name="username"
                        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="Enter your username" required>
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="h-5 w-5 text-gray-400"></i>
                    </div>
                    <input type="password" id="password" name="password"
                        class="block w-full pl-10 pr-10 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="Enter your password" required>
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer"
                        onclick="togglePassword('password', 'eyeIcon')">
                        <i id="eyeIcon" data-lucide="eye" class="h-5 w-5 text-gray-400"></i>
                    </div>
                </div>
            </div>

            <div id="loginErrorMessage" class="text-red-500 text-sm hidden text-center"></div>

            <div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Sign In
                </button>
            </div>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="registerForm" class="space-y-6 hidden">
            <div>
                <label for="reg_username" class="block text-sm font-medium text-gray-700">Choose Username</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="user-plus" class="h-5 w-5 text-gray-400"></i>
                    </div>
                    <input type="text" id="reg_username" name="username"
                        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm"
                        placeholder="Choose a username" required>
                </div>
            </div>

            <div>
                <label for="reg_password" class="block text-sm font-medium text-gray-700">Choose Password</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="h-5 w-5 text-gray-400"></i>
                    </div>
                    <input type="password" id="reg_password" name="password"
                        class="block w-full pl-10 pr-10 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm"
                        placeholder="Choose a password" required>
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer"
                        onclick="togglePassword('reg_password', 'regEyeIcon')">
                        <i id="regEyeIcon" data-lucide="eye" class="h-5 w-5 text-gray-400"></i>
                    </div>
                </div>
            </div>

            <div id="regErrorMessage" class="text-red-500 text-sm hidden text-center"></div>

            <div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors">
                    Create Account
                </button>
            </div>
        </form>

        <div class="mt-6 text-center text-sm">
            <p class="text-gray-500" id="toggleText">Need an account? <a href="#" onclick="toggleForms()"
                    class="text-blue-600 hover:text-blue-500 font-medium">Sign Up</a></p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.setAttribute("data-lucide", "eye-off");
            } else {
                input.type = "password";
                icon.setAttribute("data-lucide", "eye");
            }
            lucide.createIcons();
        }

        function toggleForms() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const title = document.getElementById('formTitle');
            const subtitle = document.getElementById('formSubtitle');
            const toggleText = document.getElementById('toggleText');

            if (loginForm.classList.contains('hidden')) {
                // Show Login
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                title.textContent = "Welcome Back";
                subtitle.textContent = "Sign in to access RAG AI Chat";
                toggleText.innerHTML = 'Need an account? <a href="#" onclick="toggleForms()" class="text-blue-600 hover:text-blue-500 font-medium">Sign Up</a>';
            } else {
                // Show Register
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                title.textContent = "Create Account";
                subtitle.textContent = "Join RAG AI Chat today";
                toggleText.innerHTML = 'Already have an account? <a href="#" onclick="toggleForms()" class="text-blue-600 hover:text-blue-500 font-medium">Sign In</a>';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('loginErrorMessage');

            errorMessage.classList.add('hidden');
            errorMessage.textContent = '';

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('/api/auth/token', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_role', data.role);
                    localStorage.setItem('username', username);
                    window.location.href = 'chat.html';
                } else {
                    const error = await response.json();
                    errorMessage.textContent = error.detail || 'Login failed';
                    errorMessage.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Login error:', err);
                errorMessage.textContent = 'Network error occurred.';
                errorMessage.classList.remove('hidden');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg_username').value;
            const password = document.getElementById('reg_password').value;
            const errorMessage = document.getElementById('regErrorMessage');

            errorMessage.classList.add('hidden');
            errorMessage.textContent = '';

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert("Account created successfully! Please sign in.");
                    toggleForms();
                } else {
                    const error = await response.json();
                    errorMessage.textContent = error.detail || 'Registration failed';
                    errorMessage.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Registration error:', err);
                errorMessage.textContent = 'Network error occurred.';
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
